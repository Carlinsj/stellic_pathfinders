endpoints:
  - method: GET
    path: /api/v1/health
    description: Check whether the backend is running.

  - method: GET
    path: /api/v1/tenants/{tenant}/demo-accounts
    description: List the temporary demo users shown by the frontend.

  - method: POST
    path: /api/v1/auth/demo/session
    description: Sign in as a demo user; replace this with real university login.

  - method: DELETE
    path: /api/v1/auth/session
    description: Sign out the current user.

  - method: GET
    path: /api/v1/tenants/{tenant}/bootstrap
    description: Load the current user and initial student-safe app data.

  - method: GET
    path: /api/v1/tenants/{tenant}/facilities
    description: List facilities with their hours, resources, and crowd estimates.

  - method: GET
    path: /api/v1/tenants/{tenant}/facilities/{facilityId}
    description: Get details for one facility.

  - method: GET
    path: /api/v1/tenants/{tenant}/facilities/{facilityId}/participation
    description: Return a student-safe aggregate of voluntary CampusFit check-ins and the 30-minute planning window beginning at the optional `at` timestamp. Never treat this response as total or official occupancy.
    query:
      at:
        type: string
        format: date-time
        required: false
        description: Arrival-window start; defaults to the current time.
    response:
      universityId: string
      facilityId: string
      intervalStart: date-time
      intervalEnd: date-time
      campusFitCheckIns: integer
      plannedCheckIns: integer
      walkInCheckIns: integer
      scheduledForWindow: integer
      scheduledNotCheckedIn: integer
      typicalVisitorRange: [integer, integer]
      confidence: low | medium | high
      updatedAt: date-time
      sourceExplanation: string
      officialOccupancyConnected: false
    privacy: Aggregate-only response. It must not contain visit IDs, user IDs, names, or another student's raw active visit.

  - method: GET
    path: /api/v1/tenants/{tenant}/recommendations
    description: Recommend facilities and times for a workout or activity.

  - method: GET
    path: /api/v1/tenants/{tenant}/me/visits
    description: List only the signed-in student's visits.

  - method: POST
    path: /api/v1/tenants/{tenant}/me/visits
    description: Plan a visit or check in now. Return the signed-in student's visit plus the refreshed aggregate participation tracker for the affected facility and arrival window.

  - method: PATCH
    path: /api/v1/tenants/{tenant}/me/visits/{visitId}
    description: Reschedule, check in, complete, extend, or cancel one of the signed-in student's visits. Rescheduling accepts an exact future arrival time and is allowed only while the visit is planned or delayed. Return the student's updated visit plus refreshed aggregate participation trackers for both the previous and new arrival windows when timing changes.
    request:
      action: reschedule | check_in | complete | extend | cancel
      plannedArrivalAt:
        type: string
        format: date-time
        requiredWhen: action is reschedule
        description: Exact future arrival time for a planned or delayed visit.
      expectedEndAt:
        type: string
        format: date-time
        requiredWhen: action is extend
        description: Exact future finish time for an active visit.
    authorization: The visit must belong to the signed-in user and match the tenant in the path. Active or closed visits cannot be rescheduled or cancelled.

  - method: DELETE
    path: /api/v1/tenants/{tenant}/me/visits/{visitId}
    description: Delete one of the student's visits and its history.

  - method: PATCH
    path: /api/v1/tenants/{tenant}/staff/facilities/{facilityId}/equipment/{equipmentTypeId}
    description: Mark a selected number of operational equipment units unavailable or restore a selected number of out-of-service units.
    request:
      action: mark_unavailable | restore
      units:
        type: integer
        minimum: 1
        description: Number of units affected. For mark_unavailable this cannot exceed the current operational quantity; for restore it cannot exceed the current out-of-service quantity.
      reason:
        type: string
        requiredWhen: action is mark_unavailable
        description: Staff-provided outage or maintenance reason.
    authorization: Requires an authorized staff session for the tenant and a facility/equipment inventory owned by that tenant.

  - method: PATCH
    path: /api/v1/tenants/{tenant}/staff/facilities/{facilityId}/hours
    description: Change today's closing time for a facility.

  - method: PUT
    path: /api/v1/tenants/{tenant}/staff/facilities/{facilityId}/closure
    description: Temporarily close a facility.

  - method: DELETE
    path: /api/v1/tenants/{tenant}/staff/facilities/{facilityId}/closure
    description: Remove a temporary facility closure.

  - method: PATCH
    path: /api/v1/tenants/{tenant}/admin/settings
    description: Update university branding, privacy, and visit settings.

  - method: POST
    path: /api/v1/tenants/{tenant}/demo/reset
    description: Reset the temporary demo data; do not include this in production.
